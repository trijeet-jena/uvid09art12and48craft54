services:
  - type: web
    name: uvid-stationery-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: cd server && npm ci
    startCommand: cd server && node src/deploy-start.js
    autoDeploy: true
    disk:
      name: uvid-store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UVID_DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Store Admin
